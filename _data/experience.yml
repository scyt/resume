# Jobs
# Head of Support
- company: Gravity Wiz
  position: Head of Support
  duration: 2019 &mdash; 2026
  summary: <ul><li>Owned customer outcomes end to end for a fully remote support team that grew from 0 to 9, handling technical issues, billing questions, and feature requests. Designed escalation workflows and a ticket-ownership model so every issue had a clear owner and handoffs were seamless for the customer, including to Product for feature and UI issues.</li><li>Raised CSAT from 75% to 94% within three months and held it for the rest of my tenure; cut first response time from 24 hours to 1 hour, with an average resolution time of 6 hours.</li><li>Spotted recurring customer pain points and turned them into actionable feedback for Product and Development, helping prioritize improvements and keep a customer-first approach across a small team.</li><li>Led an AI chatbot integration, support website redesign, and major documentation overhaul that increased issues resolved through self-service by 70% and doubled overall support capacity, freeing engineers to focus on complex technical issues.</li><li>Established support strategy, operating processes, and performance metrics, using data to prioritize work and improve results year over year; hired and developed the support managers and engineers on the team.</li><li>Led learning and development initiatives that improved the consistency and quality of customer support.</li></ul>

