# Head of Support
- company: Gravity Wiz
  position: Head of Support
  duration: 2019 &mdash; 2026
  summary: <ul><li>Built and led the support organization in a 100% remote environment, growing the team from 0 to 9 and hiring and developing support managers and engineers.</li><li>Established support strategy, operating processes, and performance metrics; used data to guide decisions and improve support performance year over year.</li><li>Improved first response time from 24 hours to 1 hour and raised CSAT from 75% to 94% within three months, sustaining that satisfaction level throughout tenure; average resolution time was 6 hours.</li><li>Partnered with Product and Development to identify recurring customer pain points, share actionable feedback, prioritize improvements, and reinforce a customer-first approach.</li><li>Designed escalation workflows from first contact through resolution for technical issues, billing questions, and feature requests. Built a ticket-ownership model that assigned responsibility for customer outcomes to the appropriate teams, including Product for feature and UI issues.</li><li>Led an AI chatbot integration, support website redesign, and major documentation improvements, increasing the volume of issues resolved through self-service by 70% and doubling overall support capacity while freeing engineers to focus on more complex issues.</li><li>Led learning and development initiatives across teams to strengthen internal knowledge and improve the consistency of customer support.</li></ul>

