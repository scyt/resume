# Site settings
title: "Scott Ryer Resume"
description: "Scott Ryer's professional resume"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Scott Ryer"
resume_title:                   "Head of Support | Customer Experience & Support Operations"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "s@scyt.io"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "828-367-9367"
resume_contact_address:         "14 Winding Road, Asheville NC"

resume_header_contact_info:     "14 Winding Road, Asheville NC • 828-367-9367 • s@scyt.io"
display_header_contact_info:    "false"

resume_header_intro: "<p>Technical support leader with 15+ years of experience building teams, scaling support operations, and developing technical talent. Proven record improving customer outcomes through clear escalation workflows, performance metrics, cross-functional product feedback, documentation, self-service, and AI-assisted support. Combines hands-on technical troubleshooting and systems experience with coaching, operational rigor, and a focus on resolving customer issues consistently while identifying opportunities to prevent them from recurring.</p>"

# use "yes" to display the email contact button,
